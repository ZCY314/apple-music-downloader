name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.1"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build
        run: go build -trimpath ./...

      - name: Set up gofmt toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Check formatting of changed Go files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$PUSH_BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BEFORE_SHA"
          else
            echo "No comparable base commit; skipping changed-file formatting check."
            exit 0
          fi

          files="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.go')"
          if [ -z "$files" ]; then
            echo "No Go files changed."
            exit 0
          fi

          unformatted="$(printf '%s\n' "$files" | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following changed Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi


  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: amdl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm amdl:ci --version
          docker run --rm --entrypoint ffmpeg amdl:ci -version | head -n 1
