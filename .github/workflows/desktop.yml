name: macOS Desktop (Intel)

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'desktop/resources/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'config.yaml.example'
      - 'docs/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'desktop/resources/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'config.yaml.example'
      - 'docs/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
      - name: Test Go engine
        run: |
          go vet ./...
          go test ./...
      - name: Build Intel engine
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          VERSION=$(cat VERSION)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags="-s -w -X amdl/internal/version.Version=$VERSION -X amdl/internal/version.Commit=$GITHUB_SHA -X amdl/internal/version.BuildDate=$BUILD_DATE" -o /tmp/amdl .
      - name: Build native SwiftUI app
        run: |
          mkdir -p 'AMDL Desktop.app/Contents/MacOS' 'AMDL Desktop.app/Contents/Resources'
          swiftc -parse-as-library -O -target x86_64-apple-macosx13.0 \
            -framework SwiftUI -framework AppKit -framework ImageIO \
            desktop/AMDLDesktop.swift -o 'AMDL Desktop.app/Contents/MacOS/AMDLDesktop'
          cp /tmp/amdl 'AMDL Desktop.app/Contents/Resources/amdl'
          cp desktop/resources/AutumnLandscape.jpg 'AMDL Desktop.app/Contents/Resources/AutumnLandscape.jpg'
          cat > 'AMDL Desktop.app/Contents/Info.plist' <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>AMDLDesktop</string>
          <key>CFBundleIdentifier</key><string>org.zcy314.amdl.desktop</string>
          <key>CFBundleName</key><string>AMDL Desktop</string>
          <key>CFBundleShortVersionString</key><string>0.1.15</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict></plist>
          PLIST
          plutil -lint 'AMDL Desktop.app/Contents/Info.plist'

      - name: Upload desktop app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AMDL-Desktop-macOS-Intel
          path: AMDL Desktop.app
          retention-days: 14
