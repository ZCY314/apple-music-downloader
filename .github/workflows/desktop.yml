name: macOS Desktop

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
      - name: Test Go engine
        run: |
          go vet ./...
          go test ./...
      - name: Build Apple Silicon engine
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -o /tmp/amdl .
      - name: Build native SwiftUI app
        run: |
          mkdir -p 'AMDL Desktop.app/Contents/MacOS' 'AMDL Desktop.app/Contents/Resources'
          swiftc -parse-as-library -O -target arm64-apple-macosx13.0 \
            -framework SwiftUI -framework AppKit \
            desktop/AMDLDesktop.swift -o 'AMDL Desktop.app/Contents/MacOS/AMDLDesktop'
          cp /tmp/amdl 'AMDL Desktop.app/Contents/Resources/amdl'
          cat > 'AMDL Desktop.app/Contents/Info.plist' <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>AMDLDesktop</string>
          <key>CFBundleIdentifier</key><string>org.zcy314.amdl.desktop</string>
          <key>CFBundleName</key><string>AMDL Desktop</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict></plist>
          PLIST
          plutil -lint 'AMDL Desktop.app/Contents/Info.plist'
